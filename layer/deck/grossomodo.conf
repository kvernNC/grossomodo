# GrossoModo : FSRCNNX 8 à la place d'EASU dans gamescope. Relu toutes les 2 secondes, pas besoin de redémarrer.
# enabled=0 : le FSR 1 d'origine de gamescope.
enabled=1
# strength : 0 = FSR 1 seul, 1 = FSRCNNX seul ; entre les deux, FSR 1 + strength x (FSRCNNX - FSR 1).
# 0.5 : meilleur compromis mesuré (plus de détail que FSR 1, moins de scintillement que les deux seuls).
strength=0.5
# compare=1 : écran partagé, FSR 1 d'origine à gauche, réglage courant à droite (trait blanc au milieu).
compare=0
